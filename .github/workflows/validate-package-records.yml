# Package records under data/packages/ merge without human review, so this
# is the check that stands in for the reviewer. Mark it as a required status
# check on the default branch so nothing reaches the deploy without it.

name: Validate package records
on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # the checker is taken from the default branch, never from the pull
      # request, so a change cannot bring along its own approval. Its tip is
      # used rather than the pull request's base commit so that a request
      # opened before this check existed is still checked, without a rebase
      - name: Checkout the checker from the default branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
      - name: Checkout the pull request
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - name: Check that every changed record matches where it is filed
        working-directory: pr
        run: |
          git diff --name-status \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | python3 ../trusted/scripts/validate_package_records.py --repo-root .
