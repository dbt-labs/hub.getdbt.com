name: Test dbt deps
on: workflow_dispatch

permissions: read-all

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
      - name: Build Hub, Fusion CLI, and Core CLI
        run: docker compose up -d --build
      - name: Wait for service start
        run: sleep 30s
        shell: bash
      - name: Test Fusion CLI
        run: docker compose run dbt-fusion deps
      - name: Test Core CLI
        run: docker compose run dbt-core deps
      - name: Cleanup
        run: docker compose down
