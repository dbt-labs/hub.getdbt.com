# Uses https://github.com/pascalgn/automerge-action and https://github.com/actions/labeler

name: Auto-merge
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  check_suite:
    types: [ completed ]

permissions: write-all


jobs:
  # Nothing merged here is reviewed by a person, so a pull request only
  # becomes eligible for the automerge label once its contents have been
  # checked against where they are filed. A change that fails this loses
  # the label it may have been given before the offending commit landed.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # the checker is taken from the base revision, never from the pull
      # request, so a change cannot bring along its own approval
      - name: Checkout the base revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Checkout the pull request
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - name: Check that every change is a package record matching its path
        working-directory: pr
        run: |
          git diff --name-status \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | python3 ../base/scripts/validate_package_records.py \
                --registry-only --repo-root .
      - name: Withdraw the automerge label
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --remove-label automerge || true
  autolabel:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label
        uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # actions/labeler@v4
        with:
          repo-token: ${{ secrets.AUTOMERGE_PAT }}
  automerge:
    needs: [ validate, autolabel ]
    # a check_suite run does no labelling, so both jobs above are skipped
    # there; what must never happen is a merge after either one has failed
    if: |
      always()
      && needs.validate.result != 'failure'
      && needs.autolabel.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge
        uses: pascalgn/automerge-action@22948e0bc22f0aa673800da838595a3e7347e584 # pascalgn/automerge-action@v0.15.6
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          MERGE_LABELS: "automerge,!work in progress,!ready for review"
          MERGE_REMOVE_LABELS: "automerge"
          LOG: DEBUG
          MERGE_RETRIES: 10
          MERGE_RETRY_SLEEP: 60000
